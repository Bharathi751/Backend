    <script>

        /* Addition */
        const add = (a,b)=>{
            return a+b
        }
        console.log(add(20,10));

        /* Subtraction */
        const subtract =(a,b)=> a-b
        console.log(subtract(20,10));

        /* Multiplication */
        const multiply = (a,b)=>{
            return a*b
        }
        console.log(multiply(20,10)) 
        
        /* Division */
        const division = (a,b)=>a/b
        console.log(division(20,10));
        
        
    </script>

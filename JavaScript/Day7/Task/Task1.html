<script>
const student = new Promise((resolve,reject)=>{
    let mark = 25

    if(mark>=35){
        resolve("Student Passed")
    }else{
        reject("Student failed")
    }
})

student.then((result)=>{
    console.log(result);
}).catch((error)=>{
    console.log(error);
}).finally(()=>{
    console.log("clean");
})
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<div id="showdata">

</div>


<script>

const  getaData = async ()=>{

    const showing = document.getElementById("showdata")

    try{

        const takeData = await fetch("https://jsonplaceholder.typicode.com/users")

        console.log(takeData)

        if(!takeData.ok){
            throw new Error("http"+takeData.status)
            return
        }

        const change = await takeData.json()

        let users = change
        console.log(users);

        let myDatas = ""

        users.forEach((e)=>{

            myDatas += `<h2> UserName : ${e.name} </h2>`
        })

        showing.innerHTML = myDatas
        
    }catch(e){
        console.log(e);
        
    }
}
getaData()

</script>

</body>
</html>

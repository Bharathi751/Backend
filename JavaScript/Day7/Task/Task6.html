<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id ="showdata">

    </div>

<script>

const showing = document.getElementById("showdata")

fetch("https://jsonplaceholder.typicode.com/users").then((res)=>{
    if(!res.ok){
    throw new Error("HTTP Error :"+ res.status)
    }
    return res.json()

}).then((data)=>{
    let userInfo = data


    let mydata =  ""

    userInfo.forEach(e=> {
        
        mydata += `<h2>UserName : ${e.name}</h2> `
    });
    showing.innerHTML = mydata
}).catch((e)=>{
    console.log(e);
}).finally(()=>{
    console.log("clean");
    
})


</script>






</body>
</html>
